
{% extends 'reviews/base.html' %}


{% block title %}
Your Review
{% endblock %}


{% block content %}
<form action="/"  method="POST" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class = "form-control {% if field.errors %} errors {% endif %}">
        {{ field.label_tag }}
        {{ field }} <!--This is the box for writing-->
        {{ field.errors }}
    </div>
    {% endfor %}

    <button>Send</button>
</form>
{% endblock %}
